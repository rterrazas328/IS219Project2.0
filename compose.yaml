services:
  db:
    build: ./db_build
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "27017:27017"
    volumes:
      - "db_data:/data/db"
      - "./backup:/backup"
    healthcheck:
      test: >
        mongosh --db IS219 --username "$(cat $MONGO_INITDB_ROOT_USERNAME_FILE)" --password "$(cat $MONGO_INITDB_ROOT_PASSWORD_FILE)" --authenticationDatabase "admin" --eval 'db.adminCommand("ping")'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    
    secrets:
      - db_user
      - db_password

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_AUTH_SRC: admin
    depends_on:
      db:
        condition: service_healthy
    ports:
    - "51751:51751"

    secrets:
      - db_user
      - db_password

secrets:
  db_user:
    file: "secrets/db_user.txt"
  db_password:
    file: "secrets/db_password.txt"

volumes:
  db_data: